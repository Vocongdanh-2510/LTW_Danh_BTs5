# Server Port
server.port=8080
server.servlet.context-path=/

# 1. Cấu hình JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 2. Cấu hình Kết nối CSDL SQL Server (Database: webst2)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst2;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=1234567@a$
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 3. Cấu hình JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 4. Cấu hình Upload File
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 5. Cấu hình Static Resource và Upload Path
app.upload.dir=src/main/webapp/uploads/
